name: Fetch Stock Data

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker symbol, or "defaults" for GEV+NVDA'
        required: true
        default: 'defaults'
      start:
        description: 'Start date YYYY-MM-DD'
        required: false
        default: ''
      end:
        description: 'End date YYYY-MM-DD (default: today)'
        required: false
        default: ''
      interval:
        description: 'Bar interval: 1d | 1wk | 1mo | 1h | 15m | 5m'
        required: false
        default: '1d'
      fields:
        description: 'close | all'
        required: false
        default: 'close'
  push:
    paths:
      - 'requests.txt'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yfinance
        run: pip install yfinance --quiet

      - name: Fetch data
        run: |
          mkdir -p data
          safe_name() { echo "$1" | tr '=^' '__' | tr '[:upper:]' '[:lower:]'; }

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "=== Batch mode: reading requests.txt ==="
            while IFS= read -r line || [ -n "$line" ]; do
              [[ "$line" =~ ^#.*$ || -z "$line" ]] && continue
              TICKER=$(echo "$line" | awk '{print $1}')
              START=$(echo "$line" | awk '{print $2}')
              OUTFILE="data/$(safe_name "$TICKER")_prices.json"
              echo "Fetching $TICKER from $START → $OUTFILE"
              python fetch_stock_data.py -t "$TICKER" -s "$START" -o "$OUTFILE" || echo "WARN: $TICKER failed"
            done < requests.txt
          else
            TICKER="${{ inputs.ticker }}"
            START="${{ inputs.start }}"
            END="${{ inputs.end }}"
            INTERVAL="${{ inputs.interval }}"
            FIELDS="${{ inputs.fields }}"
            if [ "$TICKER" = "defaults" ]; then
              python fetch_stock_data.py -t GEV  -s 2024-04-02 -o data/gev_prices.json
              python fetch_stock_data.py -t NVDA -s 2019-01-01 -o data/nvda_prices.json
            else
              OUTFILE="data/$(safe_name "$TICKER")_prices.json"
              ARGS="-t $TICKER -o $OUTFILE"
              [ -n "$START" ]    && ARGS="$ARGS -s $START"
              [ -n "$END" ]      && ARGS="$ARGS -e $END"
              [ -n "$INTERVAL" ] && ARGS="$ARGS -i $INTERVAL"
              [ -n "$FIELDS" ]   && ARGS="$ARGS -f $FIELDS"
              python fetch_stock_data.py $ARGS
            fi
          fi

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No new data." && exit 0
          git commit -m "data: batch fetch $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
